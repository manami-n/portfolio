<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>Contact Form ■ KOKUBAN Wedding</title>
  <link rel="icon" href="../fav.ico">
  <link href="../css/cmn.css" rel="stylesheet" type="text/css">
  <link href="https://fonts.googleapis.com/css?family=Karma|Vampiro+One" rel="stylesheet">
  <link href="../css/order_contact.css" rel="stylesheet" type="text/css">
  <script src="../js/jquery-3.3.1.min.js"></script>
  <script src="../js/jquery.paroller.min.js"></script>
  <script type="text/javascript" src="../js/ajaxzip3.js"></script>
  <script src="../js/cmn.js"></script>
  <script src="../js/contact.js"></script>
</head>

<body>
  <header>
    <div class="logo"><img src="../images/logo.png" width="214" height="130" alt="KOKUBAN Wedding"></div>
    <aside class="nav_wrap">
      <div class="nav_bg"></div>
      <button type="button" class="burger_button"> <span class="bar bar1"></span> <span class="bar bar2"></span> <span
          class="bar bar3"></span></button>
      <nav class="nav_rightbg">
        <ul class="nav">
          <li><a href="../index.html">Home</a></li>
          <li><a href="../about/index.html">About</a></li>
          <li><a href="../prices/index.html">Sizes &amp; Prices</a></li>
          <li><a href="../works/index.html">Works</a></li>
          <li><a href="../faq/index.html">FAQ</a></li>
          <li><a href="../order/index.html">Order</a></li>
          <li><a href="../contact/index.html">Contact</a></li>
        </ul>
      </nav>
    </aside>
  </header>
  <div class="paroller_visu">
    <h1>Contact Form</h1>
  </div>
  <section class="description">
    <p>ご質問、ご要望など 下記フォームにご記入のうえ送信してください。<br>
      ２〜３日以内にご連絡させていただきます。<br>
      <span>＊は必須項目です。</span></p>
  </section>
  <section class="sec1">
    <!-- Form functionality has been removed as it is a demo website. -->
    <form name="contactform" action="">
      <div class="part4">
        <h2>お問い合わせフォーム</h2>
        <table class="clearfix">
          <tr>
            <th><label for="name">お名前</label><span> ＊</span><br>
              <p class="alert" id="dtname">お名前をご入力ください</p>
            </th>
            <td colspan="2"><input name="name" type="text" required id="name" value=""></td>
          </tr>
          <tr>
            <th> <label for="email">メールアドレス</label><span> ＊</span>
              <p class="alert" id="dtemail" value="">Ｅメールアドレスをご入力ください</p>
            </th>
            <td colspan="2"><input name="email" type="email" required id="email"> </td>
          </tr>
          <tr>
            <th><label for="email2">メールアドレス（確認）</label><span> ＊</span>
              <p class="alert" id="dtemail2" value="">Ｅメールアドレスをご確認ください</p>
            </th>
            <td colspan="2"><input name="email2" type="email" required id="email2"></td>
          </tr>
          <tr>
            <th><label for="content">お問い合わせ内容</label><span> ＊</span>
              <p class="alert" id="dtcontent" value="">内容をご入力ください</p>
            </th>
            <td colspan="2">
              <textarea name="content" required id="content"></textarea></td>
          </tr>
        </table>
      </div>
      <input name="cfm" class="button" id="cfm" value="確認">
    </form>
  </section>
  <footer><small>Copyright © KOKUBAN Wedding All Rights Reserved.</small></footer>
</body>

</html>
